apiVersion: batch/v1
kind: Job
metadata:
  name: model-bootstrap
  namespace: mlops-platform
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: model-bootstrap
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-mlflow
        image: mlops-platform:1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -c
        - "import time, urllib.request\nfor _ in range(120):\n    try:\n        urllib.request.urlopen(\"\
          http://mlflow:5000/health\", timeout=2).read()\n        raise SystemExit(0)\n\
          \    except Exception:\n        time.sleep(1)\nraise SystemExit(\"mlflow\
          \ unavailable\")\n"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      containers:
      - name: bootstrap
        image: mlops-platform:1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - scripts/compose_bootstrap.sh
        env:
        - name: MLFLOW_TRACKING_URI
          value: http://mlflow:5000
        - name: MLOPS_CONFIG
          value: /app/configs/train.yaml
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /app/configs/train.yaml
          subPath: train.yaml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: mlops-config
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
