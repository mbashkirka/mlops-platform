apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: mlops-platform
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
  - name: broker
    port: 19092
    targetPort: broker
  - name: controller
    port: 29093
    targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: mlops-platform
spec:
  selector:
    app: kafka
  ports:
  - name: broker
    port: 19092
    targetPort: broker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: mlops-platform
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: storage-permissions
        image: alpine:3.22
        command:
        - sh
        - -c
        - chown -R 1000:1000 /var/lib/kafka/data
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
      containers:
      - name: kafka
        image: apache/kafka:4.3.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: broker
          containerPort: 19092
        - name: controller
          containerPort: 29093
        env:
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:19092
        - name: KAFKA_LISTENERS
          value: CONTROLLER://:29093,PLAINTEXT://:19092
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka-0.kafka-headless.mlops-platform.svc.cluster.local:29093
        - name: CLUSTER_ID
          value: 4L6g3nShT-eMCtK--X86sw
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
          value: '1'
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          tcpSocket:
            port: broker
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: broker
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: broker
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
