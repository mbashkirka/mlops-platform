services:
  kafka-storage-init:
    image: alpine:3.22
    command:
    - sh
    - -c
    - chown -R 1000:1000 /tmp/kraft-combined-logs
    user: 0:0
    volumes:
    - kafka-data:/tmp/kraft-combined-logs
    restart: "no"
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
    - ${KAFKA_HOST_PORT:-29092}:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092},PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
    - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --list >/dev/null
        2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
  kafka-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-platform:1.0.0
    command: python -m mlops_platform.kafka_admin --config configs/train.yaml
    environment:
      MLOPS_KAFKA_ENABLED: 'true'
      MLOPS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
  api:
    environment:
      MLOPS_KAFKA_ENABLED: 'true'
      MLOPS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MLOPS_KAFKA_PREDICTION_TOPIC: mlops.predictions.v1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-platform:1.0.0
    command:
    - python
    - -m
    - mlops_platform.kafka_consumer
    - --config
    - configs/train.yaml
    - --event-log
    - /var/lib/mlops/events/prediction_events.jsonl
    - --batch
    - data/monitoring/current_batch.csv
    environment:
      MLOPS_KAFKA_ENABLED: 'true'
      MLOPS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MLOPS_KAFKA_PREDICTION_TOPIC: mlops.predictions.v1
      MLOPS_KAFKA_CONSUMER_GROUP: mlops-monitoring-v1
    volumes:
    - kafka-events:/var/lib/mlops/events
    - ./data/monitoring:/app/data/monitoring
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/mlops-kafka-consumer.ready
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
volumes:
  kafka-data: null
  kafka-events: null
