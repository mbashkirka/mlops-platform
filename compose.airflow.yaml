name: mlops-platform-airflow

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: mlops-platform:1.0.0

x-airflow-image: &airflow-image
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_VERSION: "3.3.1"
  image: mlops-platform-airflow:1.0.0

x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-m6-dev-jwt-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ}"
  AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:-m6-dev-api-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ}"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLOPS_CONFIG: /opt/airflow/project/configs/train.yaml
  MLOPS_AIRFLOW_PROJECT_ROOT: /opt/airflow/project

x-airflow-common: &airflow-common
  <<: *airflow-image
  environment:
    <<: *airflow-environment
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./data/monitoring:/opt/airflow/project/data/monitoring
    - airflow-logs:/opt/airflow/logs

services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mlflow:
    <<: *app-image
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////var/lib/mlflow/mlflow.db
      - --artifacts-destination
      - /var/lib/mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "${AIRFLOW_MLFLOW_HOST_PORT:-5051}:5000"
    volumes:
      - airflow-mlflow-state:/var/lib/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://127.0.0.1:8080/api/v2/monitor/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    <<: *app-image
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLOPS_CONFIG: configs/train.yaml
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "${AIRFLOW_API_HOST_PORT:-8001}:8000"
    restart: unless-stopped

volumes:
  airflow-db:
  airflow-logs:
  airflow-mlflow-state:
