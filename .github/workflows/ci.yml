name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CI_IMAGE: mlops-platform:ci

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run quality gate
        run: make quality
      - name: Validate Kubernetes and security contracts
        run: |
          make k8s-config
          make security-config
          make release-config
      - name: Exercise deterministic MLflow registry path
        run: |
          make data
          make train
          make mlflow-smoke
          make register
          make registry-smoke

  container-security:
    name: Container security
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build local CI image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.CI_IMAGE }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root runtime user
        shell: bash
        run: |
          user="$(docker inspect --format '{{.Config.User}}' "${CI_IMAGE}")"
          case "$user" in
            app|10001|10001:10001) ;;
            *) echo "unexpected container user: $user" >&2; exit 1 ;;
          esac
          echo "container_user=$user"
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          scan-type: image
          version: v0.73.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
