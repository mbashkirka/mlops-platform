name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching pyproject.toml, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  publish:
    name: Build, attest, publish, and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve release tag and image name
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag='${{ inputs.tag }}'
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Install project and validate release contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          make quality
          make k8s-config
          make security-config
          python scripts/release_validate.py --tag "${{ steps.release.outputs.tag }}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release candidate
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: mlops-platform:release-candidate
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan release candidate with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mlops-platform:release-candidate
          scan-type: image
          version: v0.73.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=sha
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless-sign immutable image digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify keyless signature
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign verify
          --certificate-identity-regexp
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/.*"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          "${IMAGE}@${DIGEST}"
