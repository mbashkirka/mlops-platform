seed: 42
dataset:
  n_samples: 4000
  n_features: 20
  n_informative: 12
  n_redundant: 4
  class_sep: 1.2
split:
  test_size: 0.25
model:
  C: 1.0
  max_iter: 1000
paths:
  dataset: data/raw/dataset.csv
  artifact_dir: artifacts
mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mlops-platform-dev
  run_name: logistic-regression-baseline
registry:
  model_name: mlops-platform-logistic-regression
  candidate_alias: candidate
  champion_alias: champion
  min_roc_auc: 0.9
  min_improvement: 0.0
serving:
  host: 127.0.0.1
  port: 8000
  model_alias: champion
  probability_threshold: 0.5
monitoring:
  profile_bins: 10
  min_batch_rows: 200
  max_missing_ratio: 0.01
  max_non_finite_ratio: 0.0
  psi_warning_threshold: 0.1
  psi_retrain_threshold: 0.2
  drifted_feature_ratio_threshold: 0.25
  outside_reference_ratio_threshold: 0.15
  experiment_name: mlops-platform-monitoring
  run_name: batch-drift-check
kafka:
  enabled: false
  bootstrap_servers: 127.0.0.1:29092
  prediction_topic: mlops.predictions.v1
  consumer_group: mlops-monitoring-v1
  topic_partitions: 3
  retained_batch_events: 1000
  delivery_timeout_ms: 10000
